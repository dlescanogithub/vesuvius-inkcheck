site_name: inkcheck / Ink Recoverability Protocol
site_description: Does an ink-detection model see known ink at this resolution? CPU-only validation of Herculaneum ink maps.
site_url: https://dlescanogithub.github.io/vesuvius-inkcheck/
repo_url: https://github.com/dlescanogithub/vesuvius-inkcheck
repo_name: dlescanogithub/vesuvius-inkcheck
edit_uri: ""
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
exclude_docs: |
  CPU_INFERENCE.md
  RESOLUTION_STUDY.md
  make_onepager.py
  IRP_onepager.pdf
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tutorial (5 min): TUTORIAL.md
  - Protocol: protocol.md
  - Ink card schema (v1): schema.md
  - CI for model PRs: ci.md
  - Public leaderboard: leaderboard.md
  - Reference set v0: refset.md
  - API reference: api.md
  - FAQ: faq.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
