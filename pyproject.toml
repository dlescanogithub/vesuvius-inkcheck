[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vesuvius-inkcheck"
dynamic = ["version"]
description = "Does an ink model see KNOWN ink at this resolution? Cross-resolution validation of Herculaneum ink predictions against a published reference, with search-matched null tests."
readme = "README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Diego Lescano"}]
keywords = ["vesuvius-challenge", "herculaneum", "papyrus", "ink-detection", "validation", "x-ray-ct", "virtual-unwrapping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=10", "tifffile>=2023.1", "imagecodecs>=2023.1"]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-learn>=1.2", "numcodecs>=0.11", "jsonschema>=4.18"]
schema = ["jsonschema>=4.18"]
zarr = ["numcodecs>=0.11"]
notebook = ["nbformat>=5", "nbclient>=0.7", "ipykernel>=6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/dlescanogithub/vesuvius-inkcheck"
Documentation = "https://dlescanogithub.github.io/vesuvius-inkcheck/"
Source = "https://github.com/dlescanogithub/vesuvius-inkcheck"
Issues = "https://github.com/dlescanogithub/vesuvius-inkcheck/issues"
Changelog = "https://github.com/dlescanogithub/vesuvius-inkcheck/blob/main/CHANGELOG.md"

[project.scripts]
inkcheck = "inkcheck.cli:main"

[tool.setuptools.dynamic]
version = {attr = "inkcheck.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkcheck = ["schemas/*.json"]
