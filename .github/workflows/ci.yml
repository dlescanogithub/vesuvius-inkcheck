name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - name: unit tests (CPU, offline; network-marked tests are deselected)
        run: cd tests && python -m pytest -q -m "not network"
      - name: synthetic quickstart must PASS (exit 0) and its negative must FAIL (exit 2)
        run: |
          python examples/make_synthetic_example.py
          inkcheck examples/data/synthetic_pred_9.6um.png examples/data/synthetic_ref_19.2um.png \
            --pred-um 9.6 --ref-um 19.2 --ref-origin 128,128 --workers 2 --out out/synthetic
          set +e; inkcheck examples/data/synthetic_negative_pred_9.6um.png examples/data/synthetic_ref_19.2um.png \
            --pred-um 9.6 --ref-um 19.2 --ref-origin 128,128 --workers 2 --out out/synthetic_neg; rc=$?; set -e
          test "$rc" -eq 2
      - name: IRP cards build from the shipped case files
        run: inkcheck report examples/irp/*.case.json --out out/cards
      - name: CI wrapper used by action.yml (synthetic PASS exits 0, negative exits 1)
        run: |
          INKCHECK_PRED=examples/data/synthetic_pred_9.6um.png INKCHECK_REF=examples/data/synthetic_ref_19.2um.png \
            INKCHECK_PRED_UM=9.6 INKCHECK_REF_UM=19.2 INKCHECK_ARGS="--ref-origin 128,128 --workers 2" \
            INKCHECK_OUT=out/ci/pos bash scripts/inkcheck_ci.sh
          set +e
          INKCHECK_PRED=examples/data/synthetic_negative_pred_9.6um.png INKCHECK_REF=examples/data/synthetic_ref_19.2um.png \
            INKCHECK_PRED_UM=9.6 INKCHECK_REF_UM=19.2 INKCHECK_ARGS="--ref-origin 128,128 --workers 2" \
            INKCHECK_OUT=out/ci/neg bash scripts/inkcheck_ci.sh; rc=$?; set -e
          test "$rc" -eq 1
