# Build the documentation site (mkdocs --strict) and deploy it to GitHub Pages.
# Runs only by hand (workflow_dispatch); never on pushes, tags or pull requests. The tag trigger was removed because
# the github-pages environment protection rule blocks deployments from tags, so tag runs failed (v0.3.0, 2026-10-29).
# Inert until GitHub Pages is enabled for the repository with "Source: GitHub Actions".
name: docs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
