name: inkcheck
description: >-
  Check that an ink-detection model's predicted map sees known ink on a labelled Herculaneum segment
  (search-matched shift nulls + wrong-place negative control) and attach a versioned ink card.
author: Diego Lescano
branding:
  icon: check-circle
  color: gray-dark
inputs:
  prediction:
    description: Predicted ink map (tif/png/jpg/npy), path in the workspace.
    required: true
  reference:
    description: Published reference ink map of the same segment (tif/png/jpg/npy).
    required: true
  pred-um:
    description: Prediction pixel size in micrometres.
    required: true
  ref-um:
    description: Reference pixel size in micrometres.
    required: true
  args:
    description: Extra inkcheck check options, e.g. "--ref-origin 128,128 --mask valid.png --workers 2".
    required: false
    default: "--workers 2"
  card-args:
    description: Provenance for the ink card, e.g. "--scroll PHerc0139 --segment <id> --model my-model --prereg PREREG.md".
    required: false
    default: ""
  fail-on:
    description: "FAIL (fail the job on FAIL or INVALID), WEAK (also on WEAK) or never."
    required: false
    default: FAIL
  control:
    description: "1 = also run the wrong-place negative control and record it on the card; 0 = skip."
    required: false
    default: "1"
  out:
    description: Output prefix for check JSON/PNG and the ink card.
    required: false
    default: inkcheck-out/check
  python-version:
    description: Python version for actions/setup-python.
    required: false
    default: "3.12"
  install:
    description: >-
      pip requirement for inkcheck. Default installs the action's own checkout (same version as the tag you pin).
    required: false
    default: ""
outputs:
  verdict:
    description: Final verdict on the card (PASS, WEAK, FAIL or INVALID).
    value: ${{ steps.check.outputs.verdict }}
  card:
    description: Path of the ink card JSON.
    value: ${{ steps.check.outputs.card }}
  card-md:
    description: Path of the ink card Markdown.
    value: ${{ steps.check.outputs.card-md }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: install inkcheck
      shell: bash
      env:
        REQ: ${{ inputs.install }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$REQ" ]; then python -m pip install "$REQ"; else python -m pip install "$ACTION_PATH"; fi
    - name: inkcheck
      id: check
      shell: bash
      env:
        INKCHECK_PRED: ${{ inputs.prediction }}
        INKCHECK_REF: ${{ inputs.reference }}
        INKCHECK_PRED_UM: ${{ inputs.pred-um }}
        INKCHECK_REF_UM: ${{ inputs.ref-um }}
        INKCHECK_ARGS: ${{ inputs.args }}
        INKCHECK_CARD_ARGS: ${{ inputs.card-args }}
        INKCHECK_FAIL_ON: ${{ inputs.fail-on }}
        INKCHECK_CONTROL: ${{ inputs.control }}
        INKCHECK_OUT: ${{ inputs.out }}
        OMP_NUM_THREADS: "2"
      run: bash "${{ github.action_path }}/scripts/inkcheck_ci.sh"
